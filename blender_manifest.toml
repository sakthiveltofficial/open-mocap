schema_version = "1.0.0"

# Unique add-on id (lowercase). Becomes the module name bl_ext.<repo>.openmocap.
id = "openmocap"
version = "1.1.0"
name = "OpenMocap"
tagline = "Markerless video-to-BVH motion capture, two engines"
maintainer = "Open Mocap contributors"
type = "add-on"

website = "https://github.com/sakthiveltofficial/open-mocap"

# First Blender version with the extension/manifest system. OpenMocap's code
# also uses Blender 5.x APIs with 4.3/4.4 fallbacks already in place.
blender_version_min = "4.2.0"

# OpenMocap is GPL-3.0-or-later: a modified version of BlendCap by Arcomade
# (GPL-3.0-or-later). The Pro engine's AGPL-3.0 YOLO11 dep bridges via
# GPL v3 sec.13. The bundled model weights and third-party
# code ship under their own terms - full texts in LICENSE + NOTICE.txt at
# the root and in licenses/.
license = [
  "SPDX:GPL-3.0-or-later",
]
copyright = [
  "2026 Arcomade (BlendCap)",
  "2026 Open Mocap contributors",
]

tags = [
  "Animation",
  "Rigging",
  "Pipeline",
]

[permissions]
network = "Download AI models and Python deps during setup"
files = "Read video and write caches, BVH, and Python env"

[build]
# Only consulted by `blender --command extension build`. Keeps runtime
# artifacts out of a built zip - especially venv/ and checkpoints/, which
# the installer rebuilds/downloads on the user's machine. Release zips are
# assembled by hand; this list also serves anyone building from a source
# checkout.
paths_exclude_pattern = [
  "__pycache__/",
  "*.pyc",
  "/.git/",
  "/venv/",
  "/checkpoints/",
  "*.blend1",
  "/installer/install.log",
  "/installer/install_marker.json",
  "/installer/requested_profile.txt",
  "/installer/.uv/",
  "/installer/.uv_pip/",
]
